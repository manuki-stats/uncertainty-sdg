# Conda layer of the thesis env: Python, R and the R bridge, all from conda-forge.
# Python packages come from pip afterwards (requirements.txt):
#   mamba env create -f environment.yml
#   conda activate synth2
#   pip install --no-cache-dir -r requirements.txt
# Exact versions resolved on the LRZ cluster: environment-lock.yml.
name: synth2
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - r-base=4.5.1
  - r-synthpop=1.9_3
  - rpy2=3.6.7
