# Conda-level spec. The exact pinned Python packages live in requirements.txt
# (generated by `pip freeze` from the working `synth` environment).
# Rebuild with:  conda env create -f environment.yml  &&  pip install -r requirements.txt
name: synth
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  # R + synthpop are provided by the *system* R installation (R 4.5.1) reached
  # via rpy2. See README for the R_HOME / PATH activation-script setup on Windows.
