generator: ctgan
generator_kwargs:
  enable_gpu: true
  deterministic: true
  fix_condvec: true
  discrete_columns:
  - sex
  - nativity
  - educ
  - marital
  - class_worker
  params:
    batch_size: 500
    discriminator_dim:
    - 512
    - 512
    - 512
    discriminator_lr: 0.000262
    discriminator_steps: 5
    embedding_dim: 128
    epochs: 900
    generator_dim:
    - 256
    - 256
    - 256
    generator_lr: 5.66e-05
    pac: 5
