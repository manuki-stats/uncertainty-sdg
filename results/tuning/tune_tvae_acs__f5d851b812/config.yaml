name: tune_tvae_acs
generator: tvae
space:
  epochs:
    choice:
    - 300
    - 600
    - 900
  batch_size:
    choice:
    - 250
    - 500
    - 1000
  embedding_dim:
    choice:
    - 32
    - 64
    - 128
    - 256
  compress_dims:
    layers:
      width:
      - 128
      - 256
      depth:
      - 2
      - 3
  decompress_dims:
    layers:
      width:
      - 128
      - 256
      depth:
      - 2
      - 3
  l2scale:
    loguniform:
    - 1.0e-06
    - 0.001
  loss_factor:
    loguniform:
    - 0.5
    - 8.0
generator_kwargs:
  enable_gpu: false
  discrete_columns:
  - sex
  - nativity
  - educ
  - marital
  - class_worker
dataset: acs
formula: log_wage ~ a * female + a2 + e_lt_hs + e_some_college + e_bachelor + e_graduate
n_tune: 5000
n_random: 29
n_files: 3
n_top: 3
n_seeds: 3
seed0: 20260923
force_params: {}
