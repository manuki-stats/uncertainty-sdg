# Tuning protocol for CTGAN: 30 stage-1 fits + 12 stage-2 fits, scored by pMSE.
# Constraint from ctgan 0.12.1: batch_size must be even and divisible by pac.
# Epochs are capped at 900: the winner is refitted ~2,000 times in Steps 3-4 at
# R = 100, so per-fit cost matters, and 1500 epochs did not recover E3 anyway.
name: tune_ctgan
generator: ctgan
generator_kwargs: {enable_gpu: false}
n_tune: 5000
n_random: 29
n_files: 3
n_top: 3
n_seeds: 3
seed0: 20260923
space:
  epochs: {choice: [300, 600, 900]}
  batch_size: {choice: [250, 500, 1000]}
  pac: {choice: [1, 5, 10]}
  generator_lr: {loguniform: [5.0e-5, 1.0e-3]}
  discriminator_lr: {loguniform: [5.0e-5, 1.0e-3]}
  discriminator_steps: {choice: [1, 2, 5]}
  embedding_dim: {choice: [64, 128, 256]}
  generator_dim: {layers: {width: [128, 256, 512], depth: [2, 3]}}
  discriminator_dim: {layers: {width: [128, 256, 512], depth: [2, 3]}}
