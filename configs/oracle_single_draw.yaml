# Oracle gate, single-draw synthesis.
# Final design values (S5 benchmark, 25 Sept 2026): n_org 5000, r 2, m = K = 10.
name: oracle_single_draw
generator: oracle
generator_kwargs: {mode: single_draw}
dataset: simulation
target: population
n_org: 5000
r: 2
m: 10
K: 10
steps: [1, 2, 3, 4]
estimators: [T_alt, T_s, T_s_ppd, T_f]
alpha: 0.05
