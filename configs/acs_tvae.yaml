# ACS 2024 pseudo-population (src/data/acs.py): each replication draws its own D_org of
# 5000 without replacement from N = 717,219 (f = 0.70%); truth = the population's M2
# coefficients. q_org target from the same runs: summarise --target sample.
# TVAE with the ACS tuning winner, frozen from results/tuning/tune_tvae_acs__f5d851b812/winner.yaml (t19: 23.4 +- 5.1 vs default 49.1 +- 1.6).
name: acs_tvae
generator: tvae
generator_kwargs:
  enable_gpu: false
  discrete_columns: [sex, nativity, educ, marital, class_worker]
  params:
    batch_size: 250
    compress_dims: [256, 256, 256]
    decompress_dims: [128, 128]
    embedding_dim: 32
    epochs: 900
    l2scale: 1.55e-05
    loss_factor: 1.13
dataset: acs
target: population
n_org: 5000
r: 2
m: 10
K: 10
steps: [1, 2, 3, 4]
estimators: [T_alt, T_s, T_s_ppd]
alpha: 0.05
